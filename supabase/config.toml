# Supabase project configuration.
#
# Used by the Supabase CLI for local development and for `supabase db push` /
# `supabase functions deploy`. The live project this describes is the Mumbai one
# — region ap-south-1, chosen because support requests carry KYC-grade personal
# data and region is immutable after creation.

project_id = "qtjnlkobvnhhgsnyufzv"

[api]
enabled = true
port = 54321
# `private` is deliberately absent. Everything in it — rate-limit counters, the
# cron helpers — is unreachable over PostgREST at any key precisely because it
# is not listed here. Adding it would silently expose all of it.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Nothing legitimate reads rows over the API today (anon has no grants and staff
# use Studio), but a cap means a future permissive policy leaks a page rather
# than a table.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[storage]
enabled = true
# Per-file ceiling for the whole project. The ticket-attachments bucket sets its
# own 5 MB limit in 0006 as well; this is the outer bound.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "https://platizioglobal.com"
additional_redirect_urls = ["https://www.platizioglobal.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# No public sign-ups. The only accounts are staff, created deliberately.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

# Puts staff roles into app_metadata on every token issue. Creating the function
# in 0008 is not enough on its own — without this the hook never runs and every
# staff login gets a token with no roles, which reads as "not staff" to every
# RLS policy.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# --- Edge Functions --------------------------------------------------------
#
# verify_jwt = true on all eight, and it means three different things depending
# on who the function is for:
#
#   Public intake and status (create-ticket, finalize-ticket,
#   request-status-link, lookup-status) — the anon key must be presented. A low
#   bar, but it keeps the endpoints off the open internet, and each of them
#   carries its own real gate behind it: Turnstile, a rate limit, or a token
#   that arrived by email.
#
#   Staff (staff-attachment, invite-staff) — the anon key is *not* enough. Both
#   act as the caller rather than as the service, so the database sees the
#   staff member's own uuid and refuses anyone who is not active staff. The
#   anon key reaches them and gets a 403.
#
#   Workers (drain-outbox, sweep-storage) — called by pg_cron with the service
#   key. They additionally check role = service_role in the token, because the
#   anon key ships in the site bundle and would otherwise be enough to drive
#   the outbox.
#
# Every function listed here must also exist on disk. A function deployed but
# missing from this file gets the CLI's defaults on the next deploy, which for
# a worker would mean losing verify_jwt.

[functions.create-ticket]
verify_jwt = true

[functions.finalize-ticket]
verify_jwt = true

[functions.request-status-link]
verify_jwt = true

[functions.lookup-status]
verify_jwt = true

[functions.staff-attachment]
verify_jwt = true

[functions.invite-staff]
verify_jwt = true

[functions.drain-outbox]
verify_jwt = true

[functions.sweep-storage]
verify_jwt = true
